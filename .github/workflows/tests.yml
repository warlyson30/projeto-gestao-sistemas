name: testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: Disciplina 2
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: disciplina-2-analise-de-dados
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: disciplina-2-analise-de-dados/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Executar a suite de testes
        run: pytest
